name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v21
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Install the pinned ADR validator
        run: >-
          nix profile install github:shinzui/okf/beb89ab3bcbb705276397060d95f5580f72fbe83#okf-cli
          --extra-substituters https://shinzui.cachix.org
          --extra-trusted-public-keys shinzui.cachix.org-1:QEmAoJrA9WwLP0uxfDgktLi2BRrcvQQWdz8NzcMg4/E=
      - run: nix develop --command just ci
      - name: Inspect release tarballs without publishing
        run: |
          for package in kansoku-js kansoku-react; do
            (cd "packages/$package" && npm pack --dry-run --json) >> "$GITHUB_STEP_SUMMARY"
            (cd "packages/$package" && npm publish --dry-run --access public)
          done
